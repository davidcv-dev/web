<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beneficio Diario USDT ↔ BOB</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 30px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      width: 380px;
    }
    h2 { text-align: center; }
    label { font-weight: bold; }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 6px 0 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #005fcc; }
    .resultado {
      margin-top: 20px;
      padding: 15px;
      background: #e8f5e9;
      border-left: 5px solid #2e7d32;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Beneficio Diario</h2>

    <label>USDT Iniciales:</label>
    <input id="usdt_inicial" type="number" placeholder="Ej: 1000" />

    <label>BOB Iniciales:</label>
    <input id="bob_inicial" type="number" placeholder="Ej: 2000" />

    <label>USDT Finales:</label>
    <input id="usdt_final" type="number" placeholder="Ej: 1010" />

    <label>BOB Finales:</label>
    <input id="bob_final" type="number" placeholder="Ej: 2500" />

    <label>Tasa de Cambio (BOB → USDT):</label>
    <input id="tasa" type="number" step="0.0001" placeholder="Ej: 6.50" />

    <button onclick="calcular()">Calcular Beneficio</button>

    <div id="resultado" class="resultado" style="display:none;"></div>
  </div>

<script>
function calcular() {
  let ui = parseFloat(document.getElementById("usdt_inicial").value) || 0;
  let bi = parseFloat(document.getElementById("bob_inicial").value) || 0;
  let uf = parseFloat(document.getElementById("usdt_final").value) || 0;
  let bf = parseFloat(document.getElementById("bob_final").value) || 0;
  let tasa = parseFloat(document.getElementById("tasa").value) || 0;

  // Convertimos solo los BOB → USDT porque USD y USDT valen lo mismo
  let bobIniUSDT = bi / tasa;
  let bobFinUSDT = bf / tasa;

  let totalInicialUSDT = ui + bobIniUSDT;
  let totalFinalUSDT = uf + bobFinUSDT;

  let beneficio = totalFinalUSDT - totalInicialUSDT;

  document.getElementById("resultado").style.display = "block";
  document.getElementById("resultado").innerHTML = `
    <b>Total Inicial:</b> ${totalInicialUSDT.toFixed(2)} USDT <br>
    <b>Total Final:</b> ${totalFinalUSDT.toFixed(2)} USDT <br><br>
    <b>Beneficio Neto:</b> ${beneficio.toFixed(2)} USDT
  `;
}
</script>

</body>
</html>
